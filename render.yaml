# Render Blueprint - deploys all 3 services together.
# Push this repo to GitHub, then in Render: New -> Blueprint -> select the repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: hms-postgres-db
    databaseName: hospital_management_db
    plan: free

services:
  # ---------------- Spring Boot Backend ----------------
  - type: web
    name: hms-backend-nandani
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: JDBC_URL
        value: jdbc:postgresql://${HMS_POSTGRES_DB_HOST}:${HMS_POSTGRES_DB_PORT}/${HMS_POSTGRES_DB_DATABASE}?sslmode=require
      - key: JDBC_USER
        fromDatabase:
          name: hms-postgres-db
          property: user
      - key: JDBC_PASSWORD
        fromDatabase:
          name: hms-postgres-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ML_SERVICE_URL
        value: http://localhost:5001  # Java backend uses internal rule-based fallback if ML microservice is offline

  # ---------------- React Frontend (Static Site) ----------------
  - type: web
    name: hms-frontend-nandani
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: hms-backend-nandani
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
