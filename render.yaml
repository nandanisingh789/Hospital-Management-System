# Render Blueprint - deploys all 3 services together.
# Push this repo to GitHub, then in Render: New -> Blueprint -> select the repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------- MySQL Database (Private Service) ----------------
  - type: pserv
    name: hms-mysql-db
    runtime: docker
    dockerfilePath: ./database/Dockerfile
    plan: free

  # ---------------- Spring Boot Backend ----------------
  - type: web
    name: hms-backend-nandani
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: JDBC_URL
        value: jdbc:mysql://hms-mysql-db:3306/hospital_management_db?useSSL=false&allowPublicKeyRetrieval=true
      - key: JDBC_USER
        value: root
      - key: JDBC_PASSWORD
        value: rootpassword
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          name: hms-ml-service-nandani
          type: web
          property: hostport

  # ---------------- Python ML Microservice ----------------
  - type: web
    name: hms-ml-service-nandani
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    rootDir: ml-service
    plan: free

  # ---------------- React Frontend (Static Site) ----------------
  - type: web
    name: hms-frontend-nandani
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: hms-backend-nandani
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
