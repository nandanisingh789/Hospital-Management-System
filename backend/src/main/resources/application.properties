# ==========================================
# Hospital Management System - Configuration
# ==========================================

spring.application.name=hospital-management-system
server.port=${PORT:8080}

# ---------- MySQL / JDBC ----------
spring.datasource.url=${JDBC_URL:jdbc:mysql://localhost:3306/hospital_management_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${JDBC_USER:root}
spring.datasource.password=${JDBC_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate / JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForHMS2026ProductionUseOnly}
jwt.expiration-ms=86400000

# ---------- Razorpay ----------
# Get test keys from https://dashboard.razorpay.com/app/keys
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_test_key_secret}

# ---------- Python ML Microservice ----------
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}

# ---------- JSP ----------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---------- Misc ----------
spring.jackson.serialization.fail-on-empty-beans=false
logging.level.org.springframework.security=INFO
